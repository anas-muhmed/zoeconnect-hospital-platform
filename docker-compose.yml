# ─────────────────────────────────────────────────────────────────────────────
# HDSP / ZoeConnect — Production Docker Compose deployment
#
# Fully additive: does not replace infrastructure/docker-compose.yml (local
# Postgres+Redis dev stack), infrastructure/docker/docker-compose.selfhosted.yml
# (ECS-image-based self-hosted variant), or vendor-portal/docker-compose.yml
# (standalone vendor dev stack). Those stay exactly as they are. This file is
# the plain "Ubuntu Server + Docker Compose" production deployment target —
# Hospital Platform and Vendor Portal remain two independent applications
# (separate Postgres, separate images, separate lifecycle), matching the
# existing architecture; nothing here merges them.
#
# ── Running it ────────────────────────────────────────────────────────────
#   cp .env.production.example .env.production   # fill in real secrets first
#   docker compose --env-file .env.production --profile full up -d
#
# Common profiles (a service only starts if one of its profiles is active):
#   hospital   Hospital Platform only  (hdsp-postgres, hdsp-redis, hdsp-backend, hdsp-frontend)
#   vendor     Vendor Portal only      (vendor-postgres, vendor-backend, vendor-frontend)
#   full       Both applications + the Nginx reverse proxy
#   migration  One-shot migration runners only (hdsp-migrate, vendor-migrate) — see below
#   proxy      hdsp-nginx alone (paired with `full`, or run standalone in front of an
#              already-running `hospital`+`vendor` stack)
#
# ── Migrations ────────────────────────────────────────────────────────────
# Deliberately NOT run automatically on backend container start (no
# ENTRYPOINT wrapper script that runs `migration:run` before `node
# dist/main.js` — see docker/backend.Dockerfile / vendor-backend.Dockerfile,
# neither of which does this). Instead, run the dedicated one-shot service
# for the app you're migrating, then start/restart that app normally:
#   docker compose --env-file .env.production --profile migration run --rm hdsp-migrate
#   docker compose --env-file .env.production --profile migration run --rm vendor-migrate
# Both reuse the existing, unmodified `npm run migration:run` scripts
# (backend/package.json, vendor-portal/backend/package.json) via their
# Dockerfile's builder stage (has ts-node + src/, unlike the production
# runtime image) — no new migration tooling, no app code changes.
#
# ── Networking ────────────────────────────────────────────────────────────
# One internal bridge network. Postgres and Redis publish no host ports —
# reachable only via service name inside the network. Only the four
# application ports (3000, 3001, 4000, 4001) are published to the host,
# plus Nginx's 8080 when the `proxy`/`full` profile is active (see hdsp-nginx
# below). Production note (post-Phase-3 review): once Nginx is the sole
# public entry point (80/443 with real TLS certs), 3000/3001/4000/4001
# should stop being published to the host and only remain reachable inside
# hdsp_net — left as 4 exposed ports + Nginx for now so each app stays
# independently reachable/testable during rollout; revisit in Phase 6.
#
# ── Resource limits ────────────────────────────────────────────────────────
# `deploy.resources.limits` below are documentation of expected footprint,
# not silently-enforced caps: plain `docker compose up` (outside Swarm)
# ignores most of the `deploy` key unless you pass `--compatibility`
# (`docker compose --compatibility up -d`), which translates them to
# regular `--memory`/`--cpus` container limits. Adjust the numbers to your
# server's actual capacity before relying on `--compatibility` in production.
#
# ── Logging ────────────────────────────────────────────────────────────────
# Every service uses the shared `x-logging` anchor below (json-file, 10MB
# x 5 files per container) so container logs can't grow unbounded on disk.
#
# ── Container naming (no `container_name:` anywhere in this file) ─────────
# CRITICAL FIX (deployment-reliability audit, 2026-08): every service here
# used to pin an explicit `container_name:` identical to its service name
# (e.g. service `hdsp-backend` -> container_name `hdsp-backend`). That's the
# root cause of the "Conflict: name already in use" / "removal of container
# ... is already in progress" failures deploy.sh/rollback.sh were hitting.
# Docker container names are a single GLOBAL namespace at the Engine level,
# independent of which compose project/invocation/generation touched them.
# `docker compose up -d`'s recreate path (stop old -> remove old -> create
# new) is not fully synchronous end-to-end: dockerd can still be finishing
# the old container's teardown asynchronously after the CLI call that
# triggered it has already returned, especially for I/O-heavier containers
# or slower block storage (this host is an Oracle Cloud VM). With a FIXED
# name, the very next `up -d` invocation that touches that same service —
# whether a retry, or (worse) deploy.sh's own automatic rollback firing
# moments later from cleanup() — can race straight into that still-finishing
# removal and collide on the exact same name. Compose's DEFAULT naming
# (${COMPOSE_PROJECT_NAME}-<service>-<index>, e.g. hdsp-hdsp-backend-1) is
# what actually gives Compose (and, transitively, this deployment) room to
# never hit that collision in the first place. This costs nothing: internal
# Docker DNS resolves every service by its SERVICE name regardless of
# container_name, and nothing in this repo (scripts, nginx config, env
# vars) ever referenced the old literal container names — confirmed by
# grep before removing them.
#
# ── Project identity (`name:` below) ────────────────────────────────────
# CRITICAL FIX (deployment-architecture audit, 2026-08): this deployment
# lifecycle is built on the assumption that exactly ONE Compose project,
# named "hdsp", owns every container across every release -- deploy.sh and
# rollback.sh both `export COMPOSE_PROJECT_NAME=hdsp` before invoking
# `docker compose`, specifically so that recreating containers for a NEW
# release (a different directory, a different copy of this file) still
# targets the SAME project identity as the currently-running one, rather
# than starting a second, parallel project. That only holds as long as
# EVERY invocation of `docker compose` against this file sets the project
# name explicitly. It doesn't take a script bug to break that guarantee --
# a single manual `docker compose up -d` run by hand from inside a release
# directory (e.g. `/opt/hdsp/releases/release-20260806110954-a835376/`,
# during troubleshooting, with no `-p`/`COMPOSE_PROJECT_NAME` given) falls
# through to Compose's own default: the basename of the directory
# containing the compose file. That silently creates a second, fully
# independent "release-20260806110954-a835376" project with its own
# containers (including its own Postgres, on a fresh, empty,
# project-scoped volume completely disconnected from the real
# `hdsp_hdsp_postgres_data` volume) that the real "hdsp" project has no
# knowledge of and no way to see via `docker compose ps` (project-scoped)
# -- yet those containers stay alive, holding the same host ports (4000,
# 3000, 3001, 4001, 80, 443) and joining the same external `hdsp_hdsp_net`
# network (see below) as the real deployment, causing every subsequent
# real deploy/rollback to fail with "Bind for 0.0.0.0:4000 failed" and
# container-name conflicts. `name:` here makes "hdsp" the project identity
# INTRINSIC to this file: Compose's precedence is `-p` flag >
# `COMPOSE_PROJECT_NAME` env > this `name:` key > directory-basename
# fallback -- so now even a bare `docker compose up -d` with nothing else
# set resolves to the correct "hdsp" project instead of a shadow one.
# deploy.sh/rollback.sh keep their own explicit `COMPOSE_PROJECT_NAME=hdsp`
# export too -- deliberate redundancy, not leftover cruft: two independent
# guarantees of the same project identity, so no single missed export or
# accidentally-edited-out `name:` key can reintroduce this bug.
name: hdsp

networks:
  hdsp_net:
    name: hdsp_hdsp_net
    external: true

volumes:
  hdsp_postgres_data:
  hdsp_redis_data:
  hdsp_uploads:
  hdsp_logs:
  hdsp_backups:
  vendor_postgres_data:


x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ══════════════════════════════════════════════════════════════════════
  # Hospital Platform
  # ══════════════════════════════════════════════════════════════════════

  hdsp-postgres:
    image: postgres:15
    # CRITICAL FIX: no `container_name:` — see the file header note above
    # ("Container naming" section) for the full root-cause explanation.
    # Left to Compose's own deterministic default (hdsp-hdsp-postgres-1);
    # internal DNS still resolves this service by its SERVICE name
    # (hdsp-postgres) exactly as before, so nothing downstream changes.
    restart: unless-stopped
    logging: *default-logging
    profiles: [hospital, full, migration]
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
    volumes:
      - hdsp_postgres_data:/var/lib/postgresql/data
    networks: [hdsp_net]
    # No `ports:` — internal-only, per the networking decision above.
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  hdsp-redis:
    image: redis:7
    restart: unless-stopped
    logging: *default-logging
    profiles: [hospital, full]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --bind 0.0.0.0
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 3600 1
      --save 300 100
      --save 60 10000
      --loglevel notice
    volumes:
      - hdsp_redis_data:/data
    networks: [hdsp_net]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M   # keep above --maxmemory 256mb above, headroom for Redis overhead
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  hdsp-backend:
    # CRITICAL FIX (incremental-build audit, 2026-08): was ${HDSP_VERSION},
    # a single tag variable shared by all 5 app-tier images. That assumed
    # every deploy rebuilds and re-tags all 5 in lockstep -- no longer true
    # now that the CI pipeline skips rebuilding a service whose inputs
    # didn't change. Each service now has its own version variable, resolved
    # independently from manifest.yml's per-service `images.*.tag` (see
    # deploy.sh/rollback.sh's manifest-lib.sh usage). manifest.yml's.
    # structure/keys are unchanged -- this only starts using the per-image
    # granularity that schema already had, instead of every image
    # coincidentally holding the same value.
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/hdsp-backend:${BACKEND_VERSION:-latest}
    pull_policy: always  # ensures `docker compose pull && up -d` always picks up the newly published tag
    restart: unless-stopped
    logging: *default-logging
    profiles: [hospital, full]
    depends_on:
      hdsp-postgres: { condition: service_healthy }
      hdsp-redis:    { condition: service_healthy }
    # CRITICAL FIX (release-immutability architecture, 2026-08): was a
    # relative `.env.production` path, which only resolves if a file (or
    # symlink) by that exact name exists INSIDE whichever directory this
    # compose file is invoked from -- i.e. the release directory itself.
    # That requirement was the entire reason deploy.sh and rollback.sh both
    # had to write a symlink into the release directory on every run,
    # mutating its mtime and (for rollback.sh specifically) silently
    # corrupting release-ordering discovery elsewhere in the pipeline (see
    # deploy.yml's "Fetch previous release manifest" step and deploy.sh's
    # release-pruning cleanup, both fixed alongside this). An absolute path
    # to the one real, canonical env file needs no per-release copy or
    # symlink at all -- release directories can now be genuinely immutable
    # after extraction. DEPLOY_ROOT is hardcoded as /opt/hdsp in both
    # deploy.sh and rollback.sh already, so this isn't a new assumption.
    env_file:
      - /opt/hdsp/.env.production
    environment:
      # Service-discovery + topology values that only make sense inside
      # this compose file — everything else (secrets, feature flags,
      # Oracle/WhatsApp/S3/backup config) comes from .env.production
      # unchanged, matching backend/.env.example's variable names 1:1.
      NODE_ENV:  production
      PORT:      3001
      DB_HOST:   hdsp-postgres
      DB_PORT:   5432
      REDIS_HOST: hdsp-redis
      REDIS_PORT: 6379
      FRONTEND_URL: ${HDSP_FRONTEND_URL:-http://localhost:3000}
      # Build/version metadata follow-up (2026-08): exposed on GET / and
      # GET /health/ready so a readiness probe response identifies exactly
      # which release/image answered it -- useful once there's more than
      # one replica and a rollout/rollback is in flight. Sourced from
      # deploy.sh/rollback.sh's already-exported BACKEND_VERSION (this
      # service's own per-service image tag) and SHORT_SHA (the overall
      # release's manifest.yml release.short_sha, i.e. "which deploy run
      # produced the bundle currently on disk" -- stable across a
      # partially-incremental build even when BACKEND_VERSION itself was
      # carried forward unchanged).
      APP_VERSION: ${BACKEND_VERSION:-unknown}
      RELEASE_ID:  ${SHORT_SHA:-unknown}
      DEPLOYMENT_MODE: cloud
      WEBSITE_LOGIN_URL: https://zoeconnect.in/sign-in
      APP_LOGIN_URL: https://app.zoeconnect.in/login
    ports:
      - '3001:3001'
    # ROOT-CAUSE FIX (production incident, 2026-08 — "Uploaded media
    # disappears after deployment"): these three named/bind volumes used to
    # mount at /app/uploads, /app/logs, /app/keys -- but docker/backend.
    # Dockerfile's runtime stage sets `WORKDIR /repo/backend` and `CMD
    # ["node", "dist/main.js"]`, so the running process's actual cwd (and
    # therefore every path this app resolves via `process.cwd()` --
    # main.ts's `path.join(__dirname, '..', 'uploads', ...)` for the CMS/
    # display/feedback upload dirs, LocalStorageProvider's `uploads` root,
    # common/utils/logger.util.ts's default `./logs`, and license.service.ts's
    # `process.cwd()/keys/license-public.pem` -- resolves to
    # `/repo/backend/<dir>`, never `/app/<dir>`. `/app/uploads` was therefore
    # an empty directory nobody ever wrote to or read from, while every
    # upload actually landed in `/repo/backend/uploads` -- INSIDE the
    # container's writable layer, not the named volume -- and was silently
    # discarded the moment that container was replaced by the next
    # deployment's fresh image (whose Dockerfile re-creates an empty
    # `uploads/` at build time). Mount targets corrected to match the
    # Dockerfile's real WORKDIR; volume names/host paths are unchanged, so
    # existing volume DATA is preserved -- only where it's mounted changes.
    #
    # Backup persistence follow-up (2026-08 audit): backup.config.ts's
    # `defaultLocalBackupDir()` already resolves to /var/lib/zoeconnect/backups
    # on Linux (deliberately not process.cwd()-relative), but that path was
    # never backed by a volume here -- same class of bug as uploads/logs/keys
    # above, just for backup archives instead. LocalBackupStorageProvider now
    # also fails startup if this ever regresses (see its onModuleInit()).
    volumes:
      - hdsp_uploads:/repo/backend/uploads
      - hdsp_logs:/repo/backend/logs
      - /opt/hdsp/keys/backend:/repo/backend/keys:ro
      - hdsp_backups:/var/lib/zoeconnect/backups
    networks: [hdsp_net]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
      # Do NOT set `replicas: > 1` here without first checking how
      # BullMQ queue consumers and @nestjs/schedule cron jobs
      # (app.module.ts) behave under multiple concurrent instances —
      # this backend was not audited for that as part of Dockerization.
      # PROCESS_ROLE=worker (see main.ts) can split HTTP from
      # queue/cron duty onto a second service, but coordinating
      # multiple *worker* replicas (avoiding duplicate cron firing /
      # duplicate job processing) is a separate design task, not
      # something Compose scaling handles for you. See README_DOCKER.md.
    # HEALTHCHECK is already defined in docker/backend.Dockerfile
    # (GET /api/v1/health/live); not redeclared here.

  hdsp-frontend:
    # See hdsp-backend's comment above -- same fix, this service's own var.
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/hdsp-frontend:${FRONTEND_VERSION:-latest}
    pull_policy: always  # ensures `docker compose pull && up -d` always picks up the newly published tag
    restart: unless-stopped
    logging: *default-logging
    profiles: [hospital, full]
    depends_on:
      hdsp-backend: { condition: service_healthy }
    environment:
      NODE_ENV: production
      # Used by frontend/next.config.mjs's rewrites() for its /api,
      # /socket.io, and /uploads/* proxy rules — server-side only
      # (container-to-container), unlike the NEXT_PUBLIC_API_URL build
      # arg above, which is baked in for the browser.
      BACKEND_URL: http://hdsp-backend:3001
    ports:
      - '3000:3000'
    networks: [hdsp_net]
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

  hdsp-migrate:
    # Uses BACKEND_VERSION, not a separate IMAGE_TAG -- migrations must
    # always run against the exact same backend image tag being deployed
    # this run (whether newly built or reused), never an independently
    # resolved value that could drift from it.
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/hdsp-backend:${BACKEND_VERSION:-latest}
    # No container_name here either -- this is a `run --rm` one-shot
    # service; fixing its name meant a still-cleaning-up previous migration
    # run's container could collide with the next one for the exact same
    # reason app-tier services did (see the "Container naming" note above).
    profiles: [migration]
    depends_on:
      hdsp-postgres: { condition: service_healthy }
    # See the hdsp-backend service's matching comment (release-immutability
    # architecture, 2026-08) -- absolute path, no per-release symlink needed.
    env_file:
      - /opt/hdsp/.env.production
    environment:
      NODE_ENV: production
      DB_HOST:  hdsp-postgres
      DB_PORT:  5432
    command: ["node", "node_modules/typeorm/cli.js", "-d", "dist/database/data-source.js", "migration:run"]
    networks: [hdsp_net]
    restart: "no"
    logging: *default-logging

  # ══════════════════════════════════════════════════════════════════════
  # Vendor Portal (independent application — separate DB, separate images)
  # ══════════════════════════════════════════════════════════════════════

  vendor-postgres:
    image: postgres:15
    restart: unless-stopped
    logging: *default-logging
    profiles: [vendor, full, migration]
    environment:
      POSTGRES_USER:     ${VENDOR_DB_USER}
      POSTGRES_PASSWORD: ${VENDOR_DB_PASS}
      POSTGRES_DB:       ${VENDOR_DB_NAME}
    volumes:
      - vendor_postgres_data:/var/lib/postgresql/data
    networks: [hdsp_net]
    # No `ports:` — internal-only, independent from hdsp-postgres.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VENDOR_DB_USER} -d ${VENDOR_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  vendor-backend:
    # See hdsp-backend's comment above -- same fix, this service's own var.
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/hdsp-vendor-backend:${VENDOR_BACKEND_VERSION:-latest}
    pull_policy: always  # ensures `docker compose pull && up -d` always picks up the newly published tag
    # See hdsp-backend's comment above (release-immutability architecture,
    # 2026-08) -- absolute path, no per-release symlink needed.
    env_file:
      - /opt/hdsp/.env.production
    restart: unless-stopped
    logging: *default-logging
    profiles: [vendor, full]
    depends_on:
      vendor-postgres: { condition: service_healthy }
    environment:
      # vendor-backend's own var names (DB_PASS, not DB_PASSWORD — see
      # vendor-portal/backend/src/config/database.config.ts) don't match
      # the hospital backend's, so these are mapped explicitly here
      # rather than sharing .env.production's env_file wholesale.
      NODE_ENV: production
      PORT: '4000'
      DB_HOST: vendor-postgres
      DB_PORT: '5432'
      DB_USER: ${VENDOR_DB_USER}
      DB_PASS: ${VENDOR_DB_PASS}
      DB_NAME: ${VENDOR_DB_NAME}
      JWT_SECRET: ${VENDOR_JWT_SECRET}
      DEFAULT_ADMIN_PASSWORD: ${VENDOR_DEFAULT_ADMIN_PASSWORD}
      CORS_ORIGIN: ${VENDOR_CORS_ORIGIN:-http://localhost:4001}
      HDSP_BACKEND_URL: ${VENDOR_HDSP_BACKEND_URL:-http://hdsp-backend:3001}
      HDSP_PROVISIONING_API_KEY: ${VENDOR_HDSP_PROVISIONING_API_KEY:-}
      # Build/version metadata follow-up (2026-08) -- see hdsp-backend's
      # matching comment for the full rationale.
      APP_VERSION: ${VENDOR_BACKEND_VERSION:-unknown}
      RELEASE_ID:  ${SHORT_SHA:-unknown}
    ports:
      - '4000:4000'
    volumes:
      # Same root-cause fix as hdsp-backend above: docker/vendor-backend.
      # Dockerfile sets `WORKDIR /repo/vendor-portal/backend`, and
      # signing.service.ts resolves its private signing key via
      # `path.join(process.cwd(), 'keys', 'license-private.pem')` -- so
      # `/app/keys` was never read from. Left uncorrected, every vendor-
      # backend redeploy would silently regenerate/lose the license
      # signing key material instead of persisting it, which would
      # invalidate license signatures issued before that deploy.
      - /opt/hdsp/keys/vendor-portal:/repo/vendor-portal/backend/keys:ro
    networks: [hdsp_net]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    # HEALTHCHECK is already defined in docker/vendor-backend.Dockerfile
    # (TCP connect check — no health route exists in this app today).

  vendor-frontend:
    # See hdsp-backend's comment above -- same fix, this service's own var.
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/hdsp-vendor-frontend:${VENDOR_FRONTEND_VERSION:-latest}
    pull_policy: always  # ensures `docker compose pull && up -d` always picks up the newly published tag
    restart: unless-stopped
    logging: *default-logging
    profiles: [vendor, full]
    depends_on:
      vendor-backend: { condition: service_healthy }
    environment:
      NODE_ENV: production
      # CRITICAL FIX (production incident, 2026-08): this service's
      # Dockerfile CMD runs Next.js's *standalone* output (`node
      # server.js`), whose generated server template does
      # `const hostname = process.env.HOSTNAME || 'localhost'` and binds
      # to exactly that. Docker automatically injects HOSTNAME=<container
      # ID> into every container's environment by default -- with nothing
      # here to override it, the app was binding only to its own
      # container-ID hostname (which resolves to its eth0 IP), never to
      # loopback. External traffic through the published port still
      # worked (Docker's NAT lands on eth0, which WAS bound), but the
      # Dockerfile's own HEALTHCHECK -- which runs inside the container
      # and targets 127.0.0.1 -- got connection-refused every single time,
      # deterministically, on every deploy. Confirmed via
      # `docker inspect ... State.Health.Log`: 5 consecutive exit=1 with
      # empty output (a connection error, not a bad status code), and via
      # the container's own startup banner ("Local: http://<container-id>:4001"
      # instead of "Local: http://localhost:4001" like every other Next.js
      # service here). hdsp-frontend/zoeconnect don't hit this because
      # their Dockerfiles run the `next start` CLI instead, which ignores
      # HOSTNAME and binds all interfaces by default. Explicitly forcing
      # HOSTNAME here makes the standalone server bind everywhere, exactly
      # like the CLI-based services already do.
      HOSTNAME: "0.0.0.0"
    ports:
      - '4001:4001'
    networks: [hdsp_net]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  vendor-migrate:
    # Uses VENDOR_BACKEND_VERSION -- see hdsp-migrate's comment above,
    # same reasoning for the vendor app's migration runner.
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/hdsp-vendor-backend:${VENDOR_BACKEND_VERSION:-latest}
    # No container_name -- see hdsp-migrate's comment above.
    profiles: [migration]
    depends_on:
      vendor-postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DB_HOST: vendor-postgres
      DB_PORT: '5432'
      DB_USER: ${VENDOR_DB_USER}
      DB_PASS: ${VENDOR_DB_PASS}
      DB_NAME: ${VENDOR_DB_NAME}
    command: ["node", "node_modules/typeorm/cli.js", "-d", "dist/config/database.config.js", "migration:run"]
    networks: [hdsp_net]
    restart: "no"
    logging: *default-logging

  # ══════════════════════════════════════════════════════════════════════
  # ZoeConnect (Next.js Application) - MOVED TO docker-compose.override.cloud.yml
  # ══════════════════════════════════════════════════════════════════════

  # ══════════════════════════════════════════════════════════════════════
  # Reverse proxy (groundwork — see docker/nginx/). Off by default; add
  # `proxy` to your --profile list (or use `full`) to run it.
  # ══════════════════════════════════════════════════════════════════════

  hdsp-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    profiles: [proxy, full]
    depends_on:
      hdsp-frontend:   { condition: service_started }
      hdsp-backend:    { condition: service_healthy }
      vendor-frontend: { condition: service_started }
      vendor-backend:  { condition: service_healthy }
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/cloud.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/cloudflare:/etc/nginx/ssl:ro
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
      - '${NGINX_HTTPS_PORT:-443}:443'
    networks: [hdsp_net]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
