				 function autoTab(index,max){

				 function hidePanel(){
						var element = document.getElementById('panel-main');
						var icon1 = document.getElementById('down');
						var icon2 =document.getElementById('up')
						if(element.style.display=='block'){
							element.style.display='none';
							icon1.style.display='block';
							icon2.style.display='none';
						}else if(element.style.display==""){
							element.style.display='none';
							icon1.style.display='block';
							icon2.style.display='none';
						}else if(element.style.display=="none"){

							icon2.style.display='block';
							icon1.style.display='none';
						}
						else{
							element.style.display='block';

							icon1.style.display='none';
						}
					}

				document.addEventListener("DOMContentLoaded", function () {

					function checkMandatoryFields() {
						const fields = document.querySelectorAll(".mandatoryfeild");

						fields.forEach(function(field) {
							// HDSP guard: this runs synchronously inside A4J's own
							// ajax-response DOM-patch pipeline (it fires synthetic
							// input/change events while patching), not just on the
							// setInterval poll. A thrown error here can abort the rest
							// of A4J's response processing -- including invoking
							// oncomplete on the button that triggered the request -- for
							// *any* ajax action on this page, not just this field. The
							// original code crashed whenever a SELECT had no option
							// selected (selectedIndex -1, so options[-1] is undefined);
							// wrapped defensively so one unfilled dropdown can never
							// again silently break unrelated ajax completions elsewhere
							// on the page.
							try {
								var value = "";
								if (field.tagName === "SELECT") {
									var selected = field.options[field.selectedIndex];
									value = selected ? selected.value : "";
								} else {
									value = field.value;
								}

								if (value &amp;&amp; value.trim() !== "") {
									field.classList.add("filled");
								} else {
									field.classList.remove("filled");
								}
							} catch (e) {
								// Never let one bad field abort A4J's response handling.
							}
						});
					}
					document.addEventListener("input", checkMandatoryFields);
					document.addEventListener("change", checkMandatoryFields);
					setInterval(checkMandatoryFields, 300);
				});

			<!-- ==================================================================
			     HDSP Token Registration (Direct Entry): retires the iframe/
			     panel "Registration Assistant" widget entirely: no badge, no
			     docked panel, no cross-origin iframe, no reservation/heartbeat
			     lifecycle. See docs/his-integration/DIRECT_TOKEN_MRN_MAPPING.md
			     for the full design; POPUP_INTEGRATION_ARCHITECTURE.md (v1-v5)
			     describes the retired design for historical reference only.

			     What this does instead: the registrar types the token number
			     the patient was already given (kiosk/counter) into the plain
			     "HDSP Token No" field added next to UHID/MRN above. On blur,
			     hdspValidateToken() calls HDSP read-only to confirm the token
			     exists and isn't already registered, showing a small ✔/✘ next
			     to the field, purely informational; it never blocks Save.
			     When HIS's own Register button completes and assigns an MRN
			     (exactly the same success-detection this integration has
			     always used; see notifyHdspRegistrationSuccess below), this
			     page calls POST /token/registration/map/patient directly, linking the typed
			     token number to that MRN.

			     Authentication: still zero Java backend code on the HIS side,
			     exactly as every prior version of this integration. Rather
			     than a reservation-capability token (which required the old
			     panel to mint one per-reservation), this page bootstraps a
			     WORKSTATION SESSION TOKEN from HDSP's existing, already-public
			     /token/workstation/:workstationId endpoint (hdspBootstrapWorkstation
			     below), the exact same mechanism the old popup/panel always
			     used to reserve/heartbeat/map without a human HDSP login. That
			     token authorizes exactly this workstation's own configured
			     branch/location/counter and nothing else (see
			     WorkstationController/PermissionsGuard on the backend). A
			     permanent, general-purpose service-account credential is
			     deliberately NOT embedded here for the same reason the old
			     capability-token design avoided it: anything placed in this
			     page's JS is readable via view-source/devtools by anyone on
			     the LAN, so only a narrowly-scoped, workstation-bound token is
			     ever exposed here, never a credential that could act as any
			     other workstation or branch.

			     Audit attribution: hdspReadHisUsername() (unchanged from the
			     v5 panel design) reads the already-rendered HIS username out
			     of the page header and sends it as registeredByHisUser on the
			     map/patient call, so HDSP's audit trail
			     (mapping_audit_log.actor, token_records.registration_user)
			     records the real registrar, not just "workstation".
			     ================================================================ -->
			<a4j:outputPanel rendered="true">
				<div id="hdsp-status-pill" class="hdsp-status-pill"></div>

				<script type="text/javascript">
				//<![CDATA[
				(function () {
					'use strict';

					// ── Site configuration ────────────────────────────────────────────
					// The ONLY per-site configuration this plugin needs: where HDSP
					// lives. Not a credential -- just a URL, edited once per HIS
					// installation.
					var HDSP_BASE_URL = 'http://192.168.1.73:3000';

					// One physical counter/browser = one workstation, configured once
					// and reused forever (see WorkstationController on the backend).
					// This key is not a credential -- it's an opaque, client-generated
					// correlation id; the real configuration (branch/location/counter)
					// lives server-side, keyed by this id.
					var WORKSTATION_STORAGE_KEY = 'HDSP_WORKSTATION_ID';
					var SESSION_RENEW_MARGIN_MS = 5 * 60 * 1000; // re-bootstrap 5 min before expiry

					var hdspSessionToken   = null;
					var hdspSessionExpiry  = 0;
					var hdspBootstrapping  = null; // in-flight bootstrap promise, de-dupes concurrent callers

					function hdspSetStatus(text, cssClass) {
						var el = document.getElementById('hdsp-status-pill');
						if (!el) return;
						if (!text) {
							el.className = 'hdsp-status-pill';
							el.textContent = '';
							return;
						}
						el.textContent = text;
						el.className = 'hdsp-status-pill hdsp-status-visible' + (cssClass ? (' ' + cssClass) : '');
					}

					function hdspSetTokenStatus(text, cssClass) {
						var el = document.getElementById('hdsp-token-status');
						if (!el) return;
						el.textContent = text || '';
						el.className = 'hdsp-token-status' + (cssClass ? (' ' + cssClass) : '');
					}

					window.hdspClearTokenStatus = function () { hdspSetTokenStatus('', ''); };

					// Reads the already-rendered logged-in HIS username straight out of
					// the DOM -- no new hidden field, no managed bean, no REST endpoint
					// added to HIS. Unchanged from the earlier panel design. Returning
					// null (selector found nothing) is not an error -- the mapping call
					// simply omits registeredByHisUser and HDSP falls back to
					// attributing the workstation itself.
					function hdspReadHisUsername() {
						var el = document.querySelector('.Header-buttons .headerButtonColor')
							|| document.querySelector('.headerButtonColor');
						var text = el && (el.textContent || el.innerText || '').trim();
						return text || null;
					}

					// workstation_id is a Postgres UUID column (see workstation-config.entity.ts)
					// -- the generated id MUST be a valid RFC4122 UUID or every call to
					// /token/workstation/:workstationId fails with "invalid input syntax
					// for type uuid". crypto.randomUUID() only exists in secure contexts
					// (https/localhost); this HIS page is served over plain http, so that
					// API is undefined here and the fallback below is what actually runs.
					// crypto.getRandomValues(), unlike randomUUID(), IS available on http.
					function hdspGenerateUuidV4() {
						if (window.crypto && window.crypto.getRandomValues) {
							var buf = new Uint8Array(16);
							window.crypto.getRandomValues(buf);
							buf[6] = (buf[6] & 0x0f) | 0x40; // version 4
							buf[8] = (buf[8] & 0x3f) | 0x80; // variant 10
							var hex = [];
							for (var i = 0; i < 16; i++) hex.push((buf[i] + 0x100).toString(16).slice(1));
							return hex[0]+hex[1]+hex[2]+hex[3] + '-' + hex[4]+hex[5] + '-' + hex[6]+hex[7]
								+ '-' + hex[8]+hex[9] + '-' + hex[10]+hex[11]+hex[12]+hex[13]+hex[14]+hex[15];
						}
						// Last-resort fallback (no crypto API at all) -- still valid UUID v4
						// syntax, just Math.random()-seeded instead of CSPRNG-seeded. Fine
						// here: this is a non-secret correlation key, not a credential.
						return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
							var r = (Math.random() * 16) | 0;
							var v = (c === 'x') ? r : ((r & 0x3) | 0x8);
							return v.toString(16);
						});
					}

					var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

					function hdspWorkstationId() {
						var id = null;
						try { id = window.localStorage.getItem(WORKSTATION_STORAGE_KEY); } catch (e) { /* storage disabled */ }
						// Also regenerates if a previously-stored id isn't a valid UUID --
						// covers browsers that already cached a bad non-UUID value from
						// before this fix (e.g. "ws-<timestamp>-<random>").
						if (!id || !UUID_RE.test(id)) {
							id = hdspGenerateUuidV4();
							try { window.localStorage.setItem(WORKSTATION_STORAGE_KEY, id); } catch (e) { /* storage disabled */ }
						}
						return id;
					}

					// ── Minimal inline setup picker (first use on a fresh browser only) ──
					// No iframe, no separate route -- three plain <select> elements in a
					// small fixed-position overlay, built with vanilla DOM calls against
					// HDSP's existing, already-public options endpoints. Removed once the
					// workstation is configured; never shown again on this browser.
					function hdspShowSetupPicker(workstationId, onDone) {
						var overlay = document.createElement('div');
						overlay.style.cssText = 'position:fixed;bottom:4%;right:1%;width:280px;z-index:1002;'
							+ 'background:#fff;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.3);'
							+ 'padding:12px;font-size:12px;font-family:sans-serif;';
						overlay.innerHTML = '<div style="font-weight:bold;margin-bottom:8px;">HDSP Token Setup (one-time)</div>'
							+ '<div style="margin-bottom:6px;">Branch<br/><select id="hdspSetupBranch" style="width:100%;"></select></div>'
							+ '<div style="margin-bottom:6px;">Department / Service Center<br/><select id="hdspSetupLocation" style="width:100%;" disabled="disabled"></select></div>'
							+ '<div style="margin-bottom:8px;">Counter<br/><select id="hdspSetupCounter" style="width:100%;" disabled="disabled"></select></div>'
							+ '<button id="hdspSetupSave" type="button" style="width:100%;" disabled="disabled">Save</button>'
							+ '<div id="hdspSetupError" style="color:#991b1b;margin-top:6px;"></div>';
						document.body.appendChild(overlay);

						var branchSel = overlay.querySelector('#hdspSetupBranch');
						var locSel    = overlay.querySelector('#hdspSetupLocation');
						var counterSel= overlay.querySelector('#hdspSetupCounter');
						var saveBtn   = overlay.querySelector('#hdspSetupSave');
						var errEl     = overlay.querySelector('#hdspSetupError');

						function fillSelect(sel, items, labelKey, valueKey) {
							sel.innerHTML = '<option value="">-- select --</option>';
							(items || []).forEach(function (it) {
								var opt = document.createElement('option');
								opt.value = it[valueKey];
								opt.textContent = it[labelKey];
								sel.appendChild(opt);
							});
						}

						fetch(HDSP_BASE_URL + '/api/v1/token/workstation/options/branches')
							.then(function (r) { return r.json(); })
							.then(function (branches) { fillSelect(branchSel, branches, 'name', 'id'); })
							.catch(function () { errEl.textContent = 'Could not reach HDSP.'; });

						branchSel.addEventListener('change', function () {
							locSel.innerHTML = '<option value="">-- select --</option>';
							counterSel.innerHTML = '<option value="">-- select --</option>';
							locSel.disabled = true; counterSel.disabled = true; saveBtn.disabled = true;
							if (!branchSel.value) return;
							fetch(HDSP_BASE_URL + '/api/v1/token/workstation/options/locations?branchId=' + encodeURIComponent(branchSel.value))
								.then(function (r) { return r.json(); })
								.then(function (locations) { fillSelect(locSel, locations, 'label', 'id'); locSel.disabled = false; })
								.catch(function () { errEl.textContent = 'Could not load locations.'; });
						});

						locSel.addEventListener('change', function () {
							counterSel.innerHTML = '<option value="">-- select --</option>';
							counterSel.disabled = true; saveBtn.disabled = true;
							if (!locSel.value) return;
							fetch(HDSP_BASE_URL + '/api/v1/token/workstation/options/counters?locationId=' + encodeURIComponent(locSel.value))
								.then(function (r) { return r.json(); })
								.then(function (counters) { fillSelect(counterSel, counters, 'label', 'id'); counterSel.disabled = false; })
								.catch(function () { errEl.textContent = 'Could not load counters.'; });
						});

						counterSel.addEventListener('change', function () {
							saveBtn.disabled = !counterSel.value;
						});

						saveBtn.addEventListener('click', function () {
							saveBtn.disabled = true;
							fetch(HDSP_BASE_URL + '/api/v1/token/workstation/' + encodeURIComponent(workstationId), {
								method: 'POST',
								headers: { 'Content-Type': 'application/json' },
								body: JSON.stringify({
									branchId:   branchSel.value,
									locationId: locSel.value,
									counterId:  counterSel.value,
									configuredByLabel: hdspReadHisUsername() || 'walk-up'
								})
							}).then(function (res) {
								if (!res.ok) throw new Error('save failed');
								document.body.removeChild(overlay);
								onDone();
							}).catch(function () {
								errEl.textContent = 'Could not save configuration -- try again.';
								saveBtn.disabled = false;
							});
						});
					}

					// Resolves to a valid session token, bootstrapping (and, on a fresh
					// workstation, showing the one-time setup picker) as needed.
					// De-dupes concurrent callers into a single in-flight request.
					function hdspEnsureSession() {
						if (hdspSessionToken && Date.now() < hdspSessionExpiry - SESSION_RENEW_MARGIN_MS) {
							return Promise.resolve(hdspSessionToken);
						}
						if (hdspBootstrapping) return hdspBootstrapping;

						var workstationId = hdspWorkstationId();
						hdspBootstrapping = fetch(HDSP_BASE_URL + '/api/v1/token/workstation/' + encodeURIComponent(workstationId))
							.then(function (r) { return r.json(); })
							.then(function (data) {
								if (data && data.configured === false) {
									return new Promise(function (resolve, reject) {
										hdspShowSetupPicker(workstationId, function () {
											hdspEnsureSession().then(resolve).catch(reject);
										});
									});
								}
								if (!data || !data.sessionToken) throw new Error('no session token in bootstrap response');
								hdspSessionToken  = data.sessionToken;
								// 12h workstation session TTL (see WorkstationService) -- store
								// an absolute expiry so hdspEnsureSession can proactively renew.
								hdspSessionExpiry = Date.now() + 12 * 60 * 60 * 1000;
								return hdspSessionToken;
							})
							['finally'](function () { hdspBootstrapping = null; });
						return hdspBootstrapping;
					}

					// Best-effort, on-blur only -- never blocks Save. A typo here is
					// caught before the registrar finishes the rest of the form, but if
					// this check fails for any reason (HDSP briefly unreachable, etc.)
					// registration proceeds exactly as it always has; only the final
					// map/patient call after a successful Save actually matters.
					window.hdspValidateToken = function () {
						var field = document.getElementById('hdspTokenNumber');
						var tokenNumber = field && field.value.trim();
						if (!tokenNumber) { hdspSetTokenStatus('', ''); return; }

						hdspSetTokenStatus('checking...', 'hdsp-token-checking');
						hdspEnsureSession().then(function (token) {
							return fetch(HDSP_BASE_URL + '/api/v1/token/registration/' + encodeURIComponent(tokenNumber) + '/state', {
								headers: { 'Authorization': 'Bearer ' + token }
							});
						}).then(function (res) {
							if (res.status === 404) { hdspSetTokenStatus('✘ Token not found', 'hdsp-token-bad'); return; }
							if (!res.ok) { hdspSetTokenStatus('', ''); return; }
							return res.json().then(function (data) {
								if (data.mapping) {
									hdspSetTokenStatus('✘ Already registered', 'hdsp-token-bad');
								} else {
									hdspSetTokenStatus('✔ Token found', 'hdsp-token-ok');
								}
							});
						}).catch(function () { hdspSetTokenStatus('', ''); });
					};

					// ── Called from the existing Register buttons' oncomplete callbacks ──
					// (register_...Btn and register_...BtnWhatsapp further down this
					// page -- unchanged wiring, same function name/signature as every
					// earlier version of this integration, so those oncomplete
					// attributes never needed to be touched). Success detection is
					// unchanged: the existing mrnoId input's value, or the existing
					// queueno display's text, both already re-rendered by the Register
					// buttons' own reRender list. On a validation failure neither
					// element changes, so this correctly does nothing and makes no HDSP
					// call. Patient ID and Visit ID arrive as plain EL arguments, same
					// bare-property-reference pattern used elsewhere on this page.
					// a4j's oncomplete can fire the instant the Ajax response arrives,
					// which is not guaranteed to be after it finishes patching the
					// reRendered mrnoId/queueno nodes into the live DOM (RichFaces/a4j
					// applies DOM updates as a separate step after the response
					// callback chain starts). Reading those nodes synchronously here
					// can see stale (empty) values even though the save genuinely
					// succeeded a moment later -- so poll briefly instead of checking
					// once. 10 x 150ms = 1.5s ceiling, well under how long a registrar
					// takes to notice nothing happened and re-click.
					window.notifyHdspRegistrationSuccess = function (patientId, mrnArg, visitId) {
						var field = document.getElementById('hdspTokenNumber');
						var tokenNumber = field && field.value.trim();
						if (!tokenNumber) {
							// No HDSP token was ever entered for this registration --
							// nothing to map. Registration succeeds identically whether
							// or not a receptionist ever fills in the HDSP Token No field.
							return;
						}

						var attempts = 0;
						var maxAttempts = 10;

						function checkAndProceed() {
							var mrnField  = document.getElementById('navigation:mrnoId');
							var mrnDom    = mrnField ? (mrnField.value || '').trim() : '';
							var queueEl   = document.getElementById('navigation:queueno');
							var queueText = queueEl ? (queueEl.textContent || queueEl.innerText || '').trim() : '';

							var succeeded = (mrnDom !== '') || (queueText !== '');
							if (!succeeded) {
								attempts += 1;
								if (attempts < maxAttempts) {
									setTimeout(checkAndProceed, 150);
								}
								// Ran out of retries -- either validation genuinely failed
								// or the save has not completed yet. HIS's own error panel
								// (id="error") is left untouched; the typed token number
								// stays in the field so the registrar can simply fix the
								// form and Save again.
								return;
							}

							proceedWithMapping(mrnDom);
						}

						function proceedWithMapping(mrnDom) {
						var mrn = mrnDom || mrnArg || '';

						hdspEnsureSession().then(function (token) {
							return fetch(HDSP_BASE_URL + '/api/v1/token/registration/map/patient', {
								method:  'POST',
								headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
								body: JSON.stringify({
									tokenNumber:        tokenNumber,
									hisPatientId:       patientId || '',
									mrn:                mrn,
									visitId:            visitId || '',
									registeredByHisUser: hdspReadHisUsername() || undefined
								})
							});
						}).then(function (res) {
							if (res.ok) {
								hdspSetStatus('Token ' + tokenNumber + ' linked successfully.', 'hdsp-status-success');
								field.value = '';
								hdspSetTokenStatus('', '');
								setTimeout(function () { hdspSetStatus(''); }, 4000);
							} else if (res.status === 409) {
								hdspSetStatus('Token ' + tokenNumber + ' was already registered to another patient -- please use a different token.', 'hdsp-status-error');
							} else {
								hdspSetStatus('Could not link HDSP token ' + tokenNumber + ' automatically -- contact support if this repeats.', 'hdsp-status-error');
							}
						}).catch(function () {
							hdspSetStatus('Could not reach HDSP to link token ' + tokenNumber + '. Please note it down for manual follow-up.', 'hdsp-status-error');
						});
						}

						checkAndProceed();
					};

					// Bootstrap the workstation session as soon as the page loads (not
					// lazily on first field interaction) so hdspValidateToken's first
					// on-blur check doesn't have to wait on it, and so the one-time
					// setup picker (if needed) appears immediately rather than
					// mid-registration.
					hdspEnsureSession()['catch'](function () { /* surfaced again on first real use */ });
				})();
				//]]>
				</script>
			</a4j:outputPanel>

				    function rePrint(message,mrno,patId,catLookup,regId,isRenew,isDirectRenew,isRePrint){

					function printCaseSheet(patientId,locale,enableAutoPrint,filename){
						strDate = document.getElementById("navigation:createdDate").innerHTML;

						if(patientId!=""){
							if(enableAutoPrint == 'true'){
								if(filename != ''){

								var MyPage = "#{facesContext.externalContext.requestContextPath}/birtreports?_reportFormat=pdf&amp;ReportName=caseSheet.rptdesign&amp;patientId="+patientId+"&amp;__locale=" + locale+"&amp;reportLanguage="+locale+"&amp;preparedId="+strId+"&amp;preparedDate="+strDate;

							}
					  	
						}

					<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;border:1px solid grey;">
						<h1>No Records Found</h1>
					</div>
			</c:if>
			</h:form>
		</rich:modalPanel>
		<h:inputHidden value="#{patientRegistrationForm.patient.registrationCategoryId}" id="regidd" />
		<t:div id="coverWindow" style="display:#{(patientRegistrationForm.patientDuplicateList ne null)and(not empty patientRegistrationForm.patientDuplicateList)?'block':'none'};
				width: 100%; height: 100%;background: #d0d0d0;opacity: 0.5;position:fixed;top: 0;z-index: 100">
		</t:div>
		<t:div id="duplicateListId" 
        	style="display:#{(patientRegistrationForm.patientDuplicateList ne null)and(not empty patientRegistrationForm.patientDuplicateList)?'block':'none'};
        	background: white;width: 650px;height: 370px;position:fixed;top: 100px;right: 380px;padding: 10px;
			box-shadow: 1px 1px 30px grey;border: solid thin #dedede;z-index: 100">
			<div style="background: #dedede;width: 100%;height: 37px;padding: 5px">
				<h style="float:left;font-size: 18px;">DUPLICATE PATIENTS</h>
			</div>
			<div style="height: 220px;width: 100%;overflow: auto;border: solid thin silver">
				<rich:dataTable id="duplicateTable"
					width="100%" value="#{patientRegistrationForm.patientDuplicateList}"  var="dupliacteData" >
					<f:facet name="header">
						<rich:columnGroup>
							<rich:column rowspan="2">
								<h:outputText value="MRNO" style="color: white" />
							</rich:column>
							<rich:column rowspan="2" >
								<h:outputText value="Name" style="color: white" />
							</rich:column>
							<rich:column rowspan="2" >
								<h:outputText value="Gender" style="color: white"/>
							</rich:column>
							<rich:column rowspan="2" >
								<h:outputText value="Patient Type" style="color: white"/>
							</rich:column>
						</rich:columnGroup>
					</f:facet>
					<rich:column >
						<h:outputText value="#{dupliacteData[0]}"/>
					</rich:column>
					<rich:column>
						<h:outputText value="#{dupliacteData[1]} #{dupliacteData[2]}"/>
					</rich:column>
					<rich:column >
						<h:outputText value="#{dupliacteData[3]}"/>						
					</rich:column>
					<rich:column >
						<h:outputText value="#{dupliacteData[5]}"/>						
					</rich:column>	
				</rich:dataTable>
			</div>
			<div style="height: 90px;width: 100%;text-align: center;border: solid thin silver">
				<br/>
				<h:outputText>
					<font class="themeFont">" #{patientRegistrationForm.patient.mobileNo} " Already Exist !</font>
				</h:outputText>
				<br/>
				<h:outputText styleClass="themeFont" value="Do you want to continue?"/>
				<br/>
				<div style="padding: 0px 5px 0px 0px">
					<h:form>
					<a4j:commandButton value="No" style="float:right;" 
						action="#{patientRegistrationForm.closeDuplicateList}" reRender="duplicateListId,coverWindow">
						<a4j:support event="oncomplete" oncomplete="RemoveMobileNo()" /> 
					</a4j:commandButton>
					<a4j:commandButton value="Yes" style="float:right;" 
						action="#{patientRegistrationForm.closeDuplicateList}" reRender="duplicateListId,coverWindow">
					</a4j:commandButton>
					</h:form>
				</div>
			</div>
		</t:div>
		<h:inputHidden value="#{patientRegistrationForm.lang}" id="lang" />
	
	</ui:define>
</ui:composition>
