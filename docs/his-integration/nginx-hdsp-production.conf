# ==============================================================================
# HDSP + HIS — Complete production Nginx server block
# ==============================================================================
# This is a standalone, complete server{} configuration, not a snippet to be
# spliced into something else (though the /hdsp/ location block itself can
# still be lifted into an existing HIS server{} if you prefer a single vhost --
# see the note at the bottom).
#
# Topology assumed:
#   - HIS application         : upstream his_backend  (existing HIS app server)
#   - HDSP Next.js frontend   : 127.0.0.1:3000
#   - HDSP NestJS backend API : 127.0.0.1:3001
#   - TLS terminated here (adjust cert paths for your environment)
#
# Replace ALL-CAPS placeholders (SERVER_NAME, cert paths, upstream host:port)
# before deploying.
# ==============================================================================

# ── Rate limiting zones ───────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=hdsp_api_general:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=hdsp_api_auth:10m     rate=5r/s;

# ── Upstreams ──────────────────────────────────────────────────────────────────
upstream hdsp_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream hdsp_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

# ── Access log format that MASKS the access_token query param ─────────────────
# The SSE endpoint (token/registration/queue/stream) accepts a JWT via
# ?access_token=... because the browser EventSource API cannot set headers.
# Standard $request logs the full query string, which would otherwise put a
# live bearer token into the access log. This format redacts it.
map $request $hdsp_safe_request {
    "~^(?<method>\S+)\s(?<path>[^?\s]+)\?(?<qs>.*access_token=)[^&\s]+(?<rest>.*)$" "$method $path?${qs}REDACTED${rest}";
    default $request;
}

log_format hdsp_masked
    '$remote_addr - $remote_user [$time_local] '
    '"$hdsp_safe_request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" rt=$request_time';

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;
    return 301 https://$host$request_uri;
}

# ── Main HTTPS server (HIS + HDSP widget, same origin) ─────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SERVER_NAME;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/SERVER_NAME.crt;
    ssl_certificate_key /etc/nginx/ssl/SERVER_NAME.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/hdsp-access.log hdsp_masked;
    error_log  /var/log/nginx/hdsp-error.log warn;

    client_max_body_size 15m;

    # ── Security headers ────────────────────────────────────────────────────
    # X-Frame-Options SAMEORIGIN (not DENY): the HDSP widget is intentionally
    # iframed by the HIS page, and both are served from this same origin, so
    # SAMEORIGIN permits that while still blocking cross-site framing/clickjacking.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Strict-Transport-Security: enable once TLS is fully verified in prod.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # Content-Security-Policy: frame-ancestors 'self' is the modern, CSP-based
    # replacement/complement for X-Frame-Options SAMEORIGIN.
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    # ── HIS application (existing) ──────────────────────────────────────────
    # Adjust to match your current HIS Nginx config -- placeholder passthrough.
    location / {
        proxy_pass         http://his_backend;
        proxy_http_version 1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # ── HDSP widget + frontend (same-origin, avoids CORS/X-Frame-Options
    #    issues entirely) ────────────────────────────────────────────────────
    location /hdsp/ {
        rewrite ^/hdsp/(.*)$ /$1 break;
        proxy_pass          http://hdsp_frontend;
        proxy_http_version  1.1;

        proxy_set_header    Connection        "";
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;   # SSE-friendly

        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        limit_req zone=hdsp_api_general burst=40 nodelay;
    }

    # ── HDSP backend API (direct path, used by the frontend's server-side
    #    rewrites and by any same-origin fetch from the widget) ──────────────
    location /hdsp/api/ {
        rewrite ^/hdsp/api/(.*)$ /api/$1 break;
        proxy_pass          http://hdsp_backend;
        proxy_http_version  1.1;

        proxy_set_header    Connection        "";
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;

        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        limit_req zone=hdsp_api_general burst=40 nodelay;
    }

    # ── Tighter rate limit on auth endpoints (login, refresh, widget-token
    #    renewal) to blunt credential-stuffing / renewal-abuse ──────────────
    location /hdsp/api/v1/auth/ {
        rewrite ^/hdsp/api/(.*)$ /api/$1 break;
        proxy_pass          http://hdsp_backend;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        limit_req zone=hdsp_api_auth burst=10 nodelay;
    }

    # ── SSE queue stream: explicit block so buffering/timeouts are unambiguous
    #    even if the general /hdsp/api/ block above is edited later ─────────
    location /hdsp/api/v1/token/registration/queue/stream {
        rewrite ^/hdsp/api/(.*)$ /api/$1 break;
        proxy_pass          http://hdsp_backend;
        proxy_http_version  1.1;
        proxy_set_header    Connection        "";
        proxy_buffering     off;
        proxy_cache         off;
        chunked_transfer_encoding off;
        proxy_read_timeout  3600s;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
}

# ==============================================================================
# Single-vhost note: if HIS already owns its own server{} block and you cannot
# add a second one on the same server_name, copy just the `location /hdsp/`,
# `location /hdsp/api/`, `location /hdsp/api/v1/auth/`, and
# `location /hdsp/api/v1/token/registration/queue/stream` blocks (plus the
# `upstream`, `map`, `log_format`, and `limit_req_zone` blocks from the top of
# this file) into the existing HIS server{} block instead of using this one.
# ==============================================================================
