# HDSP Widget — Nginx reverse proxy configuration
# ================================================
# Add this block to the same server{} that serves the HIS application.
#
# This creates the /hdsp location that the iframe src= and all API calls
# use, keeping everything on the same origin (no CORS, no cross-origin
# postMessage issues, X-Frame-Options: SAMEORIGIN works).
#
# Prerequisites:
#   - HDSP Next.js frontend running on 127.0.0.1:3000
#   - HDSP NestJS backend  running on 127.0.0.1:3001
#
# After adding this block, reload Nginx:
#   sudo nginx -t && sudo systemctl reload nginx

location /hdsp/ {
    # Strip the /hdsp prefix before forwarding to Next.js
    rewrite ^/hdsp/(.*)$ /$1 break;
    proxy_pass         http://127.0.0.1:3000;

    proxy_http_version 1.1;

    # Required for SSE (Server-Sent Events) -- keeps the connection alive
    proxy_set_header   Connection        "";
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;   # 1-hour SSE connection lifetime

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

