# ─────────────────────────────────────────────────────────────────────────────
# Nginx main config for the Docker Compose reverse-proxy service (docker/
# nginx). NOT a copy of infrastructure/nginx/nginx.conf (that file's
# upstreams point at 127.0.0.1 — correct for the bare-metal/PM2 runbook in
# DEPLOY.md, where Nginx and the app processes share one host network
# namespace, but wrong inside Compose's internal bridge network, where
# services are reached by service name). This file mirrors that one's
# structure/settings and is included by the `hdsp-nginx` service (profiles
# `proxy`/`full`) in the root docker-compose.yml. infrastructure/nginx/ is
# untouched.
# ─────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rid="$http_x_request_id" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    client_max_body_size 100m;   # matches backend/src/main.ts's multipart fileSize limit
    server_tokens       off;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/rss+xml
                      application/atom+xml image/svg+xml;

    limit_req_zone  $binary_remote_addr  zone=general:10m  rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=login:10m    rate=5r/m;
    limit_req_zone  $binary_remote_addr  zone=api:10m      rate=100r/s;
    limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

    # ── Upstream Definitions — Docker Compose service names, not 127.0.0.1 ──
    upstream hdsp_backend {
        server hdsp-backend:3001;
        keepalive 32;
    }

    upstream hdsp_frontend {
        server hdsp-frontend:3000;
        keepalive 32;
    }

    upstream vendor_backend {
        server vendor-backend:4000;
        keepalive 32;
    }

    upstream vendor_frontend {
        server vendor-frontend:4001;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
