# ─────────────────────────────────────────────────────────────────────────────
# HDSP Virtual Host Configuration
# Place at: /etc/nginx/conf.d/hdsp.conf
#
# For production: replace self-signed cert with a proper CA-signed certificate.
# Generate self-signed for internal use:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048
#     -keyout /etc/nginx/ssl/hdsp.key
#     -out /etc/nginx/ssl/hdsp.crt
#     -subj "/CN=hdsp.hospital.local"
# ─────────────────────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name hdsp.hospital.local;     # Replace with actual hostname / IP

    ssl_certificate     /etc/nginx/ssl/hdsp.crt;
    ssl_certificate_key /etc/nginx/ssl/hdsp.key;

    # ── Security Headers ────────────────────────────────────────────────────
    add_header X-Frame-Options           "DENY"                           always;
    add_header X-Content-Type-Options    "nosniff"                        always;
    add_header X-XSS-Protection          "1; mode=block"                  always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # ── Rate Limiting ───────────────────────────────────────────────────────
    limit_conn conn_limit 20;

    # ── Static Assets (Next.js _next/static) ────────────────────────────────
    location /_next/static/ {
        proxy_pass http://hdsp_frontend;
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # ── Login Rate Limit ────────────────────────────────────────────────────
    location /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://hdsp_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── API Proxy → NestJS ──────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass         http://hdsp_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Don't expose backend errors verbatim
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    # ── WebSocket → NestJS (Socket.io) ──────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://hdsp_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        
        # Long timeouts for persistent websocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Frontend → Next.js ──────────────────────────────────────────────────
    location / {
        limit_req zone=general burst=20 nodelay;

        proxy_pass         http://hdsp_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Error Pages ─────────────────────────────────────────────────────────
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ── Block hidden files ──────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
